<svg xmlns=http://www.w3.org/2000/svg viewBox=0 0 512 512 fill=none>
  <defs>
    <radialGradient id=bgGrad cx=50% cy=50% r=50% fx=30% fy=30%>
      <stop offset=0% stop-color=#0a1f14 />
      <stop offset=70% stop-color=#020805 />
      <stop offset=100% stop-color=#000000 />
    </radialGradient>
    <linearGradient id=emeraldGold x1=0% y1=0% x2=100% y2=100%>
      <stop offset=0% stop-color=#00ff88 />
      <stop offset=50% stop-color=#10b981 />
      <stop offset=100% stop-color=#fbbf24 />
    </linearGradient>
    <linearGradient id=ringGrad x1=0% y1=100% x2=100% y2=0%>
      <stop offset=0% stop-color=#00ff88 />
      <stop offset=100% stop-color=#22d3ee />
    </linearGradient>
    <filter id=glow x=-20% y=-20% width=140% height=140%>
      <feGaussianBlur stdDeviation=12 result=blur />
      <feComposite in=SourceGraphic in2=blur operator=over />
    </filter>
    <filter id=deepGlow x=-50% y=-50% width=200% height=200%>
      <feGaussianBlur stdDeviation=24 result=blur />
      <feComposite in=SourceGraphic in2=blur operator=over />
    </filter>
  </defs>

  <circle cx=256 cy=256 r=248 fill=url(#bgGrad) stroke=url(#emeraldGold) stroke-width=8 />
  <circle cx=256 cy=256 r=216 stroke=#00ff88 stroke-width=3 stroke-dasharray=16 12 opacity=0.6 filter=url(#glow) />
  <circle cx=256 cy=256 r=190 stroke=#fbbf24 stroke-width=2 stroke-dasharray=8 8 opacity=0.4 />

  <g stroke=url(#emeraldGold) stroke-width=6 stroke-linecap=round filter=url(#glow)>
    <line x1=256 y1=48 x2=256 y2=76 />
    <line x1=256 y1=436 x2=256 y2=464 />
    <line x1=48 y1=256 x2=76 y2=256 />
    <line x1=436 y1=256 x2=464 y2=256 />
    <line x1=109 y1=109 x2=130 y2=130 stroke-width=4 opacity=0.8 />
    <line x1=403 y1=109 x2=382 y2=130 stroke-width=4 opacity=0.8 />
    <line x1=109 y1=403 x2=130 y2=382 stroke-width=4 opacity=0.8 />
    <line x1=403 y1=403 x2=382 y2=382 stroke-width=4 opacity=0.8 />
  </g>

  <circle cx=256 cy=256 r=148 stroke=url(#ringGrad) stroke-width=6 opacity=0.85 filter=url(#glow) />
  <circle cx=256 cy=256 r=128 fill=#03130a stroke=#00ff88 stroke-width=2 opacity=0.9 />

  <path d=M 286 140 L 286 280 C 286 330 256 360 210 360 C 170 360 148 335 144 300 
        stroke=url(#emeraldGold) stroke-width=24 stroke-linecap=round fill=none filter=url(#deepGlow) />
  <path d=M 286 140 L 286 280 C 286 330 256 360 210 360 C 170 360 148 335 144 300 
        stroke=#ffffff stroke-width=12 stroke-linecap=round fill=none />

  <line x1=256 y1=256 x2=256 y2=110 stroke=#00ff88 stroke-width=10 stroke-linecap=round filter=url(#glow) />
  <line x1=256 y1=256 x2=340 y2=256 stroke=#fbbf24 stroke-width=8 stroke-linecap=round filter=url(#glow) />

  <circle cx=256 cy=256 r=22 fill=#00ff88 filter=url(#deepGlow) />
  <circle cx=256 cy=256 r=14 fill=#ffffff />
  <circle cx=256 cy=256 r=6 fill=#000000 />
</svg>
